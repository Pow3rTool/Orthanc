# Reference nginx vhost for Orthanc (control plane / console). SANITIZED template —
# set your real server_name + cert paths. This is the in-repo source of truth for
# header policy + rate limits (was previously only on the box, unverifiable).
#
# IMPORTANT: the mTLS control listener (:8443) is NOT proxied here. XConnect dials
# it directly because it must terminate the client cert itself (nginx would strip
# the SPIFFE identity). Only the human/console plane (:8099 gunicorn) is fronted.

# Bound brute force on the only unauthenticated POST surface (the SSO bootstrap).
limit_req_zone $binary_remote_addr zone=orthanc_oidc:10m rate=10r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orthanc.example.com pow3rtool.example.com;

    ssl_certificate     /etc/ssl/orthanc/orthanc.pem;
    ssl_certificate_key /etc/ssl/orthanc/orthanc.pem;
    ssl_protocols TLSv1.3;                 # match the fabric's TLS 1.3 posture

    # Transport hardening (Django's SecurityMiddleware also sets HSTS; this is
    # belt-and-suspenders for any path that doesn't traverse it).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # NOTE: Content-Security-Policy is set by the app (orthanc/middleware.py) so it
    # stays versioned with the templates — do NOT duplicate it here.

    client_max_body_size 4m;               # the app needs little; bound the rest

    # X-Forwarded-Proto is REQUIRED: Django trusts it (SECURE_PROXY_SSL_HEADER) to
    # know the request is https, so secure cookies + SSL-redirect work without a loop.
    location ~ ^/oidc/(login|callback) {
        limit_req zone=orthanc_oidc burst=5 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /opt/orthanc/staticfiles/;   # collectstatic output (prod local path)
        access_log off;
        expires 1h;
    }
}

server {                                    # http -> https (Django also redirects)
    listen 80;
    listen [::]:80;
    server_name orthanc.example.com pow3rtool.example.com;
    return 301 https://$host$request_uri;
}

# XConnect's public vhost is analogous: proxy_pass to the Caller (127.0.0.1:8780)
# and /bootstrap (127.0.0.1:8790), forward the Authorization (OBO bearer) header,
# same transport headers; no CSP needed (JSON API, not HTML). Ship it alongside.
